<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HWS Döküm Hattı</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #0a0a1a;
            color: white;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, #1a1a3e, #0d0d2b);
            text-align: center;
            padding: 20px;
            border-bottom: 2px solid #333;
        }

        .header h1 { font-size: 22px; color: #00b894; }
        .header .model { font-size: 18px; color: #dfe6e9; margin-top: 8px; }
        .header .zaman { font-size: 13px; color: #636e72; margin-top: 5px; }

        .durum-bar {
            text-align: center;
            padding: 12px;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 2px;
        }
        .durum-aktif { background: #00b894; color: white; }
        .durum-durdu { background: #d63031; color: white; }

        .cards {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding: 15px;
        }

        .card {
            background: #16213e;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            border: 1px solid #2d3436;
            transition: transform 0.2s;
        }
        .card:hover { transform: scale(1.03); }

        .card .icon { font-size: 28px; }
        .card .value {
            font-size: 38px;
            font-weight: bold;
            margin: 8px 0;
        }
        .card .label {
            font-size: 13px;
            color: #b2bec3;
        }

        .saykil .value { color: #0984e3; }
        .saglam .value { color: #00b894; }
        .kaliplanan .value { color: #00cec9; }
        .bos .value { color: #fdcb6e; }
        .fire .value { color: #d63031; }
        .oran .value { color: #e17055; }

        .fire-bar-container {
            margin: 0 15px 15px 15px;
            background: #16213e;
            border-radius: 12px;
            padding: 15px;
            border: 1px solid #2d3436;
        }
        .fire-bar-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
            color: #b2bec3;
        }
        .fire-bar-bg {
            background: #2d3436;
            border-radius: 10px;
            height: 20px;
            overflow: hidden;
        }
        .fire-bar-fill {
            height: 100%;
            border-radius: 10px;
            transition: width 0.5s ease, background 0.5s ease;
        }

        .vardiya-box {
            margin: 0 15px 15px 15px;
            background: #16213e;
            border-radius: 12px;
            padding: 15px;
            border: 1px solid #2d3436;
        }
        .vardiya-box h3 {
            text-align: center;
            color: #6c5ce7;
            margin-bottom: 10px;
            font-size: 16px;
        }
        .vardiya-info {
            display: flex;
            justify-content: space-around;
            text-align: center;
        }
        .vardiya-info div { flex: 1; }
        .vardiya-info .v-label { font-size: 12px; color: #636e72; }
        .vardiya-info .v-value { font-size: 22px; font-weight: bold; color: #dfe6e9; margin-top: 4px; }
        .vardiya-aktif { border: 2px solid #6c5ce7 !important; }

        .footer {
            text-align: center;
            padding: 15px;
            font-size: 11px;
            color: #636e72;
        }

        .canli-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #00b894;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
            margin-right: 5px;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .offline-dot {
            background: #d63031;
            animation: none;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🏭 HWS Döküm Hattı</h1>
        <div class="model" id="model">Model: Yükleniyor...</div>
        <div class="zaman">
            <span class="canli-dot" id="canliDot"></span>
            <span id="guncelleme">Bağlanıyor...</span>
        </div>
    </div>

    <div class="durum-bar durum-durdu" id="durumBar">
        ⏳ BAĞLANIYOR...
    </div>

    <div class="cards">
        <div class="card saykil">
            <div class="icon">🔄</div>
            <div class="value" id="saykil">-</div>
            <div class="label">Saykıl</div>
        </div>
        <div class="card saglam">
            <div class="icon">✅</div>
            <div class="value" id="saglam">-</div>
            <div class="label">Sağlam Döküm</div>
        </div>
        <div class="card kaliplanan">
            <div class="icon">📋</div>
            <div class="value" id="kaliplanan">-</div>
            <div class="label">Kalıplanan</div>
        </div>
        <div class="card bos">
            <div class="icon">⬜</div>
            <div class="value" id="bos">-</div>
            <div class="label">Boş Kalıp</div>
        </div>
        <div class="card fire">
            <div class="icon">❌</div>
            <div class="value" id="fire">-</div>
            <div class="label">Elverişsiz</div>
        </div>
        <div class="card oran">
            <div class="icon">🔥</div>
            <div class="value" id="fireOran">-</div>
            <div class="label">Fire Oranı</div>
        </div>
    </div>

    <div class="fire-bar-container">
        <div class="fire-bar-label">
            <span>Fire Oranı</span>
            <span id="fireBarYuzde">%0</span>
        </div>
        <div class="fire-bar-bg">
            <div class="fire-bar-fill" id="fireBarFill" style="width: 0%; background: #00b894;"></div>
        </div>
    </div>

    <div class="vardiya-box" id="vardiyaBox">
        <h3 id="vardiyaBaslik">⏰ Aktif Vardiya</h3>
        <div class="vardiya-info">
            <div>
                <div class="v-label">Vardiya</div>
                <div class="v-value" id="vardiyaNo">-</div>
            </div>
            <div>
                <div class="v-label">Başlangıç</div>
                <div class="v-value" id="vardiyaBas">-</div>
            </div>
            <div>
                <div class="v-label">Bitiş</div>
                <div class="v-value" id="vardiyaBit">-</div>
            </div>
        </div>
    </div>

    <div class="footer">
        HWS Döküm Hattı İzleme Sistemi v1.0
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // Firebase ayarlari
        const firebaseConfig = {
            databaseURL: "https://hws-dokumhane-default-rtdb.europe-west1.firebasedatabase.app/"
        };
        firebase.initializeApp(firebaseConfig);

        // Vardiya hesaplama
        function vardiyaBilgisi() {
            const saat = new Date().getHours();
            if (saat >= 0 && saat < 8) {
                return { no: "V1", bas: "00:00", bit: "08:00", ad: "Vardiya 1" };
            } else if (saat >= 8 && saat < 16) {
                return { no: "V2", bas: "08:00", bit: "16:00", ad: "Vardiya 2" };
            } else {
                return { no: "V3", bas: "16:00", bit: "00:00", ad: "Vardiya 3" };
            }
        }

        // Vardiya gostergesini guncelle
        function vardiyaGuncelle() {
            const v = vardiyaBilgisi();
            document.getElementById("vardiyaBaslik").textContent = "⏰ " + v.ad + " (Aktif)";
            document.getElementById("vardiyaNo").textContent = v.no;
            document.getElementById("vardiyaBas").textContent = v.bas;
            document.getElementById("vardiyaBit").textContent = v.bit;
        }
        vardiyaGuncelle();
        setInterval(vardiyaGuncelle, 60000);

        // Son guncelleme zamani kontrolu
        let sonVeriZamani = Date.now();

        function baglantikontrol() {
            const fark = Date.now() - sonVeriZamani;
            const dot = document.getElementById("canliDot");
            if (fark > 15000) {
                dot.className = "canli-dot offline-dot";
                document.getElementById("guncelleme").textContent = "⚠️ Bağlantı kopmuş olabilir";
            }
        }
        setInterval(baglantikontrol, 5000);

        // Firebase canli dinleme
        const ref = firebase.database().ref("canli");

        ref.on("value", function(snapshot) {
            const veri = snapshot.val();
            if (!veri) return;

            sonVeriZamani = Date.now();
            document.getElementById("canliDot").className = "canli-dot";

            // Degerleri guncelle
            document.getElementById("model").textContent = "📦 " + (veri.model_adi || "?");
            document.getElementById("guncelleme").textContent = "Son: " + (veri.son_guncelleme || "?");
            document.getElementById("saykil").textContent = veri.saykil || 0;
            document.getElementById("saglam").textContent = veri.saglam_dokum || 0;
            document.getElementById("kaliplanan").textContent = veri.kaliplanan || 0;
            document.getElementById("bos").textContent = veri.bos || 0;
            document.getElementById("fire").textContent = veri.dokume_elverissiz || 0;

            // Fire orani hesapla
            const toplam = veri.kaliplanan || 0;
            const elverisiz = veri.dokume_elverissiz || 0;
            let fireOran = 0;
            if (toplam > 0) {
                fireOran = ((elverisiz / toplam) * 100).toFixed(1);
            }
            document.getElementById("fireOran").textContent = "%" + fireOran;
            document.getElementById("fireBarYuzde").textContent = "%" + fireOran;

            // Fire bar renk ve genislik
            const bar = document.getElementById("fireBarFill");
            bar.style.width = Math.min(fireOran, 100) + "%";
            if (fireOran < 3) {
                bar.style.background = "#00b894";
            } else if (fireOran < 5) {
                bar.style.background = "#fdcb6e";
            } else {
                bar.style.background = "#d63031";
            }

            // Durum gostergesi
            const durumBar = document.getElementById("durumBar");
            if (veri.durum === "CALISIYOR") {
                durumBar.textContent = "🟢 MAKİNE ÇALIŞIYOR";
                durumBar.className = "durum-bar durum-aktif";
            } else {
                durumBar.textContent = "🔴 MAKİNE DURDU";
                durumBar.className = "durum-bar durum-durdu";
            }
        });
    </script>
</body>
</html>
