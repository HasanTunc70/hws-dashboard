<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erkon Döküm | HWS Canlı Ekran</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 20px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 2px solid #1e293b; padding-bottom: 15px; }
        .header img { height: 60px; object-fit: contain; margin-right: 15px; }
        
        .status { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 14px; padding: 6px 14px; border-radius: 20px; transition: all 0.3s ease; }
        .status.live { color: #10b981; background-color: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.2); }
        .status.offline { color: #ef4444; background-color: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); }
        /* Yeni: Makine Durdu (Arıza/Mola) Rengi */
        .status.stopped { color: #f59e0b; background-color: rgba(245, 158, 11, 0.1); border: 1px solid rgba(245, 158, 11, 0.2); }
        
        .dot { width: 10px; height: 10px; border-radius: 50%; }
        .status.live .dot { background-color: #10b981; animation: pulse 1.5s infinite; }
        .status.offline .dot { background-color: #ef4444; }
        .status.stopped .dot { background-color: #f59e0b; }
        
        @keyframes pulse { 0% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(1.2); } 100% { opacity: 1; transform: scale(1); } }
        
        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        
        .card { background-color: #1e293b; border-radius: 12px; padding: 30px 20px 20px 20px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); position: relative; overflow: hidden; }
        .card.model-a { border-top: 4px solid #10b981; }
        .card.model-a .badge { background-color: #10b981; color: #fff; }
        .card.model-b { border-top: 4px solid #f59e0b; }
        .card.model-b .badge { background-color: #f59e0b; color: #fff; }
        .card.model-c { border-top: 4px solid #38bdf8; }
        .card.model-c .badge { background-color: #38bdf8; color: #0f172a; }
        
        .badge { position: absolute; top: 0; right: 0; padding: 6px 14px; border-bottom-left-radius: 12px; font-size: 11px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; }
        .card-title { font-size: 22px; font-weight: 800; color: #e2e8f0; margin-bottom: 5px; margin-top: 5px;}
        .card-subtitle { font-size: 15px; color: #94a3b8; margin-bottom: 25px; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
        .stats-grid-1 { display: grid; grid-template-columns: 1fr; gap: 10px; }
        
        .stat-box { background-color: #0f172a; padding: 20px 10px; border-radius: 8px; text-align: center; }
        .stat-label { font-size: 13px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 600;}
        .stat-value { font-size: 34px; font-weight: 800; color: #f8fafc; }
        
        .value-hedef { color: #38bdf8; }
        .value-kalip { color: #10b981; }
        .value-dokum { color: #f59e0b; }
        .value-hata { color: #ef4444; }

        .shift-header { color: #e2e8f0; font-size: 18px; font-weight: 800; margin: 35px 0 15px 0; letter-spacing: 1px; border-bottom: 1px solid #1e293b; padding-bottom: 10px; }
        .shift-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; }
        .shift-card { background-color: #1e293b; border-radius: 8px; padding: 18px; border-left: 4px solid #38bdf8; display: flex; flex-direction: column; justify-content: space-between;}
        .shift-card.current { border-left-color: #10b981; background-color: #0f172a; border: 1px solid #10b981;}
        
        .shift-card.record { border-left-color: #fbbf24; background-color: #0f172a; border: 1px solid #fbbf24; box-shadow: 0 0 15px rgba(251, 191, 36, 0.25); margin-top: 30px;}
        .shift-card.record .shift-title { color: #fbbf24; }
        
        .shift-title { font-size: 15px; font-weight: 800; color: #e2e8f0; margin-bottom: 3px; display: flex; justify-content: space-between; align-items: center;}
        .shift-date { font-size: 12px; color: #94a3b8; margin-bottom: 15px; font-weight: 600;}
        
        .shift-stats { display: flex; justify-content: space-between; font-size: 13px; font-weight: 800; margin-bottom: 15px; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 6px;}
        .s-kalip { color: #10b981; }
        .s-dokum { color: #f59e0b; }
        .s-fire { color: #ef4444; }
        .s-perf { color: #a855f7; }
        
        .shift-models-title { font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .shift-models { font-size: 13px; color: #cbd5e1; background-color: #0f172a; padding: 10px; border-radius: 6px; line-height: 1.8; font-weight: 600; }
        
        .footer { display: flex; justify-content: space-between; align-items: center; margin-top: 40px; font-size: 12px; color: #64748b; padding-top: 15px; border-top: 1px solid #1e293b; }
        .last-update { font-weight: 600; color: #94a3b8; }
        .developer { font-style: italic; color: #475569; letter-spacing: 0.5px; }
        .developer span { font-weight: 800; color: #38bdf8; font-style: normal;}
        
        .loading { text-align: center; padding: 50px; font-size: 18px; color: #94a3b8; }
        #dashboard { display: none; }
    </style>
</head>
<body>

    <div class="header">
        <img src="https://raw.githubusercontent.com/HasanTunc70/hws-dashboard/main/logo.png" onerror="this.onerror=null; this.src='https://upload.wikimedia.org/wikipedia/commons/c/ca/1x1.png'; this.parentElement.innerHTML='<h1 style=\'color:white; font-size:24px;\'>ERKON DÖKÜM</h1>';" alt="Erkon Döküm">
        
        <div id="connection-status" class="status live">
            <div class="dot"></div> <span id="status-text">CANLI VERİ</span>
        </div>
    </div>

    <div id="loading" class="loading">Sisteme bağlanılıyor, veriler yükleniyor...</div>

    <div id="dashboard">
        <div class="grid-container">
            <!-- Model A (Kalıplanan Model) -->
            <div class="card model-a" id="card-a" style="display:none;">
                <div class="badge">KALIPLANAN MODEL</div>
                <div class="card-title" id="a-isim">-</div>
                <div class="card-subtitle" id="a-kod">-</div>
                <div class="stats-grid">
                    <div class="stat-box"><div class="stat-label">HEDEF</div><div class="stat-value value-hedef" id="a-hedef">0</div></div>
                    <div class="stat-box"><div class="stat-label">KALIPLANAN</div><div class="stat-value value-kalip" id="a-kalip">0</div></div>
                    <div class="stat-box"><div class="stat-label">DÖKÜLEN</div><div class="stat-value value-dokum" id="a-dokum">0</div></div>
                    <div class="stat-box"><div class="stat-label">FİRE</div><div class="stat-value value-hata" id="a-fire">0</div></div>
                </div>
            </div>

            <!-- Model B (Sıradaki Model) -->
            <div class="card model-b" id="card-b" style="display:none;">
                <div class="badge">SIRADAKİ MODEL</div>
                <div class="card-title" id="b-isim">-</div>
                <div class="card-subtitle" id="b-kod">-</div>
                <div class="stats-grid-1">
                    <div class="stat-box"><div class="stat-label">HEDEF</div><div class="stat-value value-hedef" id="b-hedef">0</div></div>
                </div>
            </div>
            
            <!-- Model C (Daha Sonraki Model) -->
            <div class="card model-c" id="card-c" style="display:none;">
                <div class="badge">DAHA SONRAKİ MODEL</div>
                <div class="card-title" id="c-isim">-</div>
                <div class="card-subtitle" id="c-kod">-</div>
                <div class="stats-grid-1">
                    <div class="stat-box"><div class="stat-label">HEDEF</div><div class="stat-value value-hedef" id="c-hedef">0</div></div>
                </div>
            </div>
        </div>

        <h2 class="shift-header">VARDİYA ÜRETİM ÖZETİ</h2>
        <div class="shift-grid" id="shift-container"></div>
        
        <div id="record-container"></div>
    </div>

    <div class="footer">
        <div>Son Güncelleme: <span id="last-update" class="last-update">Bekleniyor...</span></div>
        <div class="developer">Geliştirici: <span>Hasan TUNÇ</span></div>
    </div>

    <script>
        const FIREBASE_URL = "https://hws-dokumhane2-default-rtdb.firebaseio.com/canli.json";
        
        let lastPingTime = 0;
        let lastKalipCount = -1;
        let lastKalipChangeTime = new Date().getTime(); // Kalıp en son ne zaman arttı?

        function getVardiyaSorumlusu(dateStr, labelStr) {
            const parts = dateStr.split('/');
            if(parts.length !== 3) return "Vardiya Ekibi";
            const vDate = new Date(parts[2], parts[1] - 1, parts[0]);
            const refDate = new Date(2026, 7, 10); 
            const diffDays = Math.floor((vDate.getTime() - refDate.getTime()) / (1000 * 60 * 60 * 24));
            let weekDiff = Math.floor(diffDays / 7);
            let cycle = ((weekDiff % 3) + 3) % 3;
            
            let baseIndex = 0;
            if (labelStr.includes("08:00 - 16:00")) baseIndex = 1;      
            else if (labelStr.includes("16:00 - 00:00")) baseIndex = 0; 
            else if (labelStr.includes("00:00 - 08:00")) baseIndex = 2; 
            
            let teamIndex = (baseIndex - cycle + 3) % 3;
            const teams = ["TKA - Burak ÇAKIR", "TKB - Melih ARSLAN", "TKC - Hasan TUNÇ"];
            return teams[teamIndex];
        }

        function hesaplaPerformans(kalipSayisi, isCurrent) {
            if(!kalipSayisi || kalipSayisi === 0) return 0;
            if(!isCurrent) return Math.round(kalipSayisi / 7.5);
            
            let n = new Date();
            let h = n.getHours();
            
            let startH = 0;
            if (h >= 0 && h < 8) startH = 0;
            else if (h >= 8 && h < 16) startH = 8;
            else startH = 16;
            
            let shiftStart = new Date(n.getFullYear(), n.getMonth(), n.getDate(), startH, 0, 0);
            
            let elapsedMins = (n - shiftStart) / 60000;
            if (elapsedMins < 1) elapsedMins = 1;
            
            let effectiveMins = elapsedMins * (450 / 480);
            let perf = Math.round((kalipSayisi / effectiveMins) * 60);
            return perf;
        }

        function updateDashboard() {
            const fetchUrl = FIREBASE_URL + "?t=" + new Date().getTime();
            
            fetch(fetchUrl)
                .then(response => response.json())
                .then(data => {
                    if(data) {
                        document.getElementById('loading').style.display = 'none';
                        document.getElementById('dashboard').style.display = 'block';

                        const getVal = (val) => parseInt(val) || 0;
                        let currentKalip = 0;
                        
                        if(data.modelA) {
                            currentKalip = getVal(data.modelA.kaliplanan);
                        }

                        // BAĞLANTI (Ping) Kontrolü
                        let currentPing = data.lastPing || 0;
                        let isInternetConnected = false;
                        
                        if (currentPing !== lastPingTime) {
                            lastPingTime = currentPing;
                            isInternetConnected = true; // Fabrika PC'si yasiyor ve ping atiyor
                        }

                        // KALIP ARTIŞ KONTROLÜ
                        if (currentKalip !== lastKalipCount) {
                            lastKalipCount = currentKalip;
                            lastKalipChangeTime = new Date().getTime();
                        }
                        
                        let timeSinceKalipChange = new Date().getTime() - lastKalipChangeTime;
                        
                        let statusEl = document.getElementById('connection-status');
                        let statusText = document.getElementById('status-text');

                        if (!isInternetConnected) {
                            // Ping degismiyorsa program kapali veya internet gitti
                            statusEl.className = "status offline";
                            statusText.innerText = "BAĞLANTI KESİLDİ";
                        } 
                        else if (timeSinceKalipChange > 120000) { 
                            // Internet var ama son 120 saniyedir (2 dakika) 1 tane bile kalip basilmadiysa makine durmustur
                            statusEl.className = "status stopped";
                            statusText.innerText = "MAKİNE DURDU (ARIZA/MOLA)";
                        } 
                        else {
                            // Her sey yolunda, uretim akiyor
                            statusEl.className = "status live";
                            statusText.innerText = "CANLI VERİ";
                        }

                        document.getElementById('last-update').innerText = new Date().toLocaleTimeString('tr-TR');

                        if(data.modelA) {
                            document.getElementById('card-a').style.display = 'block';
                            document.getElementById('a-isim').innerText = `${data.modelA.parcaAdi || '-'}`;
                            document.getElementById('a-kod').innerText = `Kalıp No: ${data.modelA.kalipNo || '-'} | Kod: ${data.modelA.parcaKodu || '-'}`;
                            document.getElementById('a-hedef').innerText = getVal(data.modelA.hedef);
                            
                            let aKalip = getVal(data.modelA.kaliplanan);
                            let aFire = getVal(data.modelA.fire);
                            let aDokum = aKalip - aFire;
                            if(aDokum < 0) aDokum = 0;
                            
                            document.getElementById('a-kalip').innerText = aKalip;
                            document.getElementById('a-fire').innerText = aFire;
                            document.getElementById('a-dokum').innerText = aDokum;
                        } else { document.getElementById('card-a').style.display = 'none'; }

                        if(data.modelB) {
                            document.getElementById('card-b').style.display = 'block';
                            document.getElementById('b-isim').innerText = `${data.modelB.parcaAdi || '-'}`;
                            document.getElementById('b-kod').innerText = `Kalıp No: ${data.modelB.kalipNo || '-'} | Kod: ${data.modelB.parcaKodu || '-'}`;
                            document.getElementById('b-hedef').innerText = getVal(data.modelB.hedef);
                        } else { document.getElementById('card-b').style.display = 'none'; }
                        
                        if(data.modelC) {
                            document.getElementById('card-c').style.display = 'block';
                            document.getElementById('c-isim').innerText = `${data.modelC.parcaAdi || '-'}`;
                            document.getElementById('c-kod').innerText = `Kalıp No: ${data.modelC.kalipNo || '-'} | Kod: ${data.modelC.parcaKodu || '-'}`;
                            document.getElementById('c-hedef').innerText = getVal(data.modelC.hedef);
                        } else { document.getElementById('card-c').style.display = 'none'; }

                        if(data.shifts && data.shifts.length > 0) {
                            let shiftHtml = "";
                            data.shifts.forEach((shift, index) => {
                                let isCurrent = (index === 0);
                                let takimSorumlusu = getVardiyaSorumlusu(shift.date, shift.label);
                                let badgeHtml = isCurrent ? `<span style="background:#10b981; color:#0f172a; padding:2px 8px; border-radius:4px; font-size:10px; margin-left:10px;">AKTİF</span>` : "";
                                
                                let vKalip = getVal(shift.toplamKalip);
                                let vFire = getVal(shift.toplamFire);
                                let vDokum = vKalip - vFire;
                                if(vDokum < 0) vDokum = 0;
                                
                                let vPerf = hesaplaPerformans(vKalip, isCurrent);
                                
                                shiftHtml += `
                                    <div class="shift-card ${isCurrent ? 'current' : ''}">
                                        <div>
                                            <div class="shift-title">${takimSorumlusu} ${badgeHtml}</div>
                                            <div class="shift-date">${shift.date} &nbsp;|&nbsp; ${shift.label} Vardiyası</div>
                                            <div class="shift-stats">
                                                <span class="s-kalip">Kalıp: ${vKalip}</span>
                                                <span class="s-dokum">Döküm: ${vDokum}</span>
                                                <span class="s-fire">Fire: ${vFire}</span>
                                                <span class="s-perf">K/Saat: ${vPerf}</span>
                                            </div>
                                        </div>
                                        <div>
                                            <div class="shift-models-title">DETAYLI ÜRETİM (MODEL NO &rarr; K | D | F)</div>
                                            <div class="shift-models">${shift.modellerMetni}</div>
                                        </div>
                                    </div>
                                `;
                            });
                            document.getElementById('shift-container').innerHTML = shiftHtml;
                        }

                        if(data.rekor) {
                            let rSorumlu = data.rekor.isim;
                            if (!rSorumlu || rSorumlu === "OTOMATIK_ISIM" || rSorumlu === "Otomatik Hesaplaniyor...") {
                                rSorumlu = getVardiyaSorumlusu(data.rekor.date, data.rekor.label);
                            }
                            
                            let rKalip = getVal(data.rekor.kalip);
                            let rFire = getVal(data.rekor.fire);
                            let rDokum = rKalip - rFire;
                            if(rDokum < 0) rDokum = 0;
                            
                            let rPerf = hesaplaPerformans(rKalip, false); 
                            
                            let rHtml = `
                                <div class="shift-card record">
                                    <div>
                                        <div class="shift-title">🏆 REKOR YAPAN VARDİYA (${rSorumlu})</div>
                                        <div class="shift-date">${data.rekor.date} &nbsp;|&nbsp; ${data.rekor.label} Vardiyası</div>
                                        <div class="shift-stats">
                                            <span style="color:#fbbf24;">Kalıp: ${rKalip}</span>
                                            <span style="color:#f59e0b;">Döküm: ${rDokum}</span>
                                            <span class="s-fire">Fire: ${rFire}</span>
                                            <span class="s-perf">K/Saat: ${rPerf}</span>
                                        </div>
                                    </div>
                                    <div>
                                        <div class="shift-models-title" style="color:#fbbf24;">DETAYLI ÜRETİM (MODEL NO &rarr; K | D | F)</div>
                                        <div class="shift-models">${data.rekor.modellerMetni}</div>
                                    </div>
                                </div>
                            `;
                            document.getElementById('record-container').innerHTML = rHtml;
                        }
                    }
                })
                .catch(err => {
                    console.log("Bağlantı hatası:", err);
                });
        }

        updateDashboard();
        setInterval(updateDashboard, 5000); 
    </script>
</body>
</html>
