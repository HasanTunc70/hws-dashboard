<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erkon Döküm | HWS Canlı Ekran</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 20px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 2px solid #1e293b; padding-bottom: 15px; }
        
        /* Erkon Logosu İçin Ayarlar */
        .header img { height: 45px; object-fit: contain; }
        
        /* Canlı/Durdu Durum Belirteci */
        .status { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 14px; padding: 6px 14px; border-radius: 20px; transition: all 0.3s ease; }
        .status.live { color: #10b981; background-color: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.2); }
        .status.offline { color: #ef4444; background-color: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); }
        
        .dot { width: 10px; height: 10px; border-radius: 50%; }
        .status.live .dot { background-color: #10b981; animation: pulse 1.5s infinite; }
        .status.offline .dot { background-color: #ef4444; }
        
        @keyframes pulse { 0% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(1.2); } 100% { opacity: 1; transform: scale(1); } }
        
        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        
        .card { background-color: #1e293b; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); position: relative; overflow: hidden; }
        .card.model-a { border-top: 4px solid #10b981; }
        .card.model-a .badge { background-color: #10b981; color: #fff; }
        .card.model-b { border-top: 4px solid #f59e0b; }
        .card.model-b .badge { background-color: #f59e0b; color: #fff; }
        .card.model-c { border-top: 4px solid #38bdf8; }
        .card.model-c .badge { background-color: #38bdf8; color: #0f172a; }
        
        .badge { position: absolute; top: 20px; right: 20px; padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; }
        .card-title { font-size: 22px; font-weight: 800; color: #e2e8f0; margin-bottom: 5px; }
        .card-subtitle { font-size: 15px; color: #94a3b8; margin-bottom: 25px; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .stat-box { background-color: #0f172a; padding: 20px 10px; border-radius: 8px; text-align: center; }
        .stat-label { font-size: 13px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 600;}
        .stat-value { font-size: 34px; font-weight: 800; color: #f8fafc; }
        
        .value-hedef { color: #38bdf8; }
        .value-kalip { color: #10b981; }
        .value-hata { color: #ef4444; }

        .shift-header { color: #e2e8f0; font-size: 18px; font-weight: 800; margin: 35px 0 15px 0; letter-spacing: 1px; border-bottom: 1px solid #1e293b; padding-bottom: 10px; }
        .shift-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; }
        .shift-card { background-color: #1e293b; border-radius: 8px; padding: 18px; border-left: 4px solid #38bdf8; display: flex; flex-direction: column; justify-content: space-between;}
        .shift-card.current { border-left-color: #10b981; background-color: #0f172a; border: 1px solid #10b981;}
        .shift-title { font-size: 15px; font-weight: 800; color: #e2e8f0; margin-bottom: 3px; }
        .shift-date { font-size: 12px; color: #94a3b8; margin-bottom: 15px; }
        .shift-stats { display: flex; justify-content: space-between; font-size: 15px; font-weight: 800; margin-bottom: 15px;}
        .s-kalip { color: #10b981; }
        .s-fire { color: #ef4444; }
        
        .shift-models-title { font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .shift-models { font-size: 13px; color: #cbd5e1; background-color: #0f172a; padding: 10px; border-radius: 6px; line-height: 1.8; font-weight: 600; }
        
        .footer { display: flex; justify-content: space-between; align-items: center; margin-top: 40px; font-size: 12px; color: #64748b; padding-top: 15px; border-top: 1px solid #1e293b; }
        .last-update { font-weight: 600; color: #94a3b8; }
        
        /* Geliştirici İmzası */
        .developer { font-style: italic; color: #475569; letter-spacing: 0.5px; }
        .developer span { font-weight: 800; color: #38bdf8; font-style: normal;}
        
        .loading { text-align: center; padding: 50px; font-size: 18px; color: #94a3b8; }
        #dashboard { display: none; }
    </style>
</head>
<body>

    <div class="header">
        <!-- Erkon Web Sitesinden Çekilen Orijinal Logo -->
        <img src="https://www.erkondokum.com.tr/Uploads/Images/212024104958-ErkonLogoBeyaz-min.png" alt="Erkon Döküm">
        
        <!-- Canlı / Durdu Göstergesi -->
        <div id="connection-status" class="status live">
            <div class="dot"></div> <span id="status-text">CANLI VERİ</span>
        </div>
    </div>

    <div id="loading" class="loading">Sisteme bağlanılıyor, veriler yükleniyor...</div>

    <div id="dashboard">
        <div class="grid-container">
            <!-- Model A (Şu An Dökülen) -->
            <div class="card model-a" id="card-a" style="display:none;">
                <div class="badge">ŞU AN DÖKÜLEN</div>
                <div class="card-title" id="a-isim">-</div>
                <div class="card-subtitle" id="a-kod">-</div>
                <div class="stats-grid">
                    <div class="stat-box"><div class="stat-label">HEDEF</div><div class="stat-value value-hedef" id="a-hedef">0</div></div>
                    <div class="stat-box"><div class="stat-label">KALIPLANAN</div><div class="stat-value value-kalip" id="a-kalip">0</div></div>
                    <div class="stat-box"><div class="stat-label">FİRE</div><div class="stat-value value-hata" id="a-fire">0</div></div>
                </div>
            </div>

            <!-- Model B (Sıradaki Model) -->
            <div class="card model-b" id="card-b" style="display:none;">
                <div class="badge">SIRADAKİ MODEL</div>
                <div class="card-title" id="b-isim">-</div>
                <div class="card-subtitle" id="b-kod">-</div>
                <div class="stats-grid">
                    <div class="stat-box"><div class="stat-label">HEDEF</div><div class="stat-value value-hedef" id="b-hedef">0</div></div>
                    <div class="stat-box"><div class="stat-label">KALIPLANAN</div><div class="stat-value value-kalip" id="b-kalip">0</div></div>
                    <div class="stat-box"><div class="stat-label">FİRE</div><div class="stat-value value-hata" id="b-fire">0</div></div>
                </div>
            </div>
            
            <!-- Model C (Daha Sonraki Model) -->
            <div class="card model-c" id="card-c" style="display:none;">
                <div class="badge">DAHA SONRAKİ MODEL</div>
                <div class="card-title" id="c-isim">-</div>
                <div class="card-subtitle" id="c-kod">-</div>
                <div class="stats-grid">
                    <div class="stat-box"><div class="stat-label">HEDEF</div><div class="stat-value value-hedef" id="c-hedef">0</div></div>
                    <div class="stat-box"><div class="stat-label">KALIPLANAN</div><div class="stat-value value-kalip" id="c-kalip">0</div></div>
                    <div class="stat-box"><div class="stat-label">FİRE</div><div class="stat-value value-hata" id="c-fire">0</div></div>
                </div>
            </div>
        </div>

        <h2 class="shift-header">VARDİYA ÜRETİM ÖZETİ</h2>
        <div class="shift-grid" id="shift-container"></div>
    </div>

    <div class="footer">
        <div>Son Güncelleme: <span id="last-update" class="last-update">Bekleniyor...</span></div>
        <div class="developer">Geliştirici: <span>Hasan TUNÇ</span></div>
    </div>

    <script>
        const FIREBASE_URL = "https://hws-dokumhane2-default-rtdb.firebaseio.com/canli.json";
        let lastFirebaseDataString = ""; // Verinin değişip değişmediğini anlamak için
        let lastDataReceiveTime = new Date().getTime(); // Son veri geliş anı

        function updateDashboard() {
            const fetchUrl = FIREBASE_URL + "?t=" + new Date().getTime();
            
            fetch(fetchUrl)
                .then(response => response.json())
                .then(data => {
                    if(data) {
                        document.getElementById('loading').style.display = 'none';
                        document.getElementById('dashboard').style.display = 'block';
                        
                        // Veri Firebase'den geldi! Şimdi verinin gerçekten "yeni" olup olmadığını kontrol edelim.
                        let currentDataString = JSON.stringify(data);
                        
                        if(currentDataString !== lastFirebaseDataString) {
                            // Fabrikadan yeni rakam veya hareket geldi!
                            lastFirebaseDataString = currentDataString;
                            lastDataReceiveTime = new Date().getTime(); // Saati sıfırla
                        }

                        // Eğer son 60 saniye içinde fabrikadan hiç yeni bir kalıp (veri değişikliği) gelmediyse, durdu yaz.
                        let timeSinceLastData = new Date().getTime() - lastDataReceiveTime;
                        let statusEl = document.getElementById('connection-status');
                        let statusText = document.getElementById('status-text');

                        if (timeSinceLastData > 60000) { // 60.000 ms = 60 saniye boyunca ayni kaldiysa
                            statusEl.className = "status offline";
                            statusText.innerText = "BAĞLANTI KESİLDİ / DURDU";
                        } else {
                            statusEl.className = "status live";
                            statusText.innerText = "CANLI VERİ";
                        }

                        // Ekrandaki güncellemeyi yansıt
                        document.getElementById('last-update').innerText = new Date().toLocaleTimeString('tr-TR');

                        const getVal = (val) => parseInt(val) || 0;

                        if(data.modelA) {
                            document.getElementById('card-a').style.display = 'block';
                            document.getElementById('a-isim').innerText = `${data.modelA.parcaAdi || '-'}`;
                            document.getElementById('a-kod').innerText = `Kalıp No: ${data.modelA.kalipNo || '-'} | Kod: ${data.modelA.parcaKodu || '-'}`;
                            document.getElementById('a-hedef').innerText = getVal(data.modelA.hedef);
                            document.getElementById('a-kalip').innerText = getVal(data.modelA.kaliplanan);
                            document.getElementById('a-fire').innerText = getVal(data.modelA.fire);
                        } else { document.getElementById('card-a').style.display = 'none'; }

                        if(data.modelB) {
                            document.getElementById('card-b').style.display = 'block';
                            document.getElementById('b-isim').innerText = `${data.modelB.parcaAdi || '-'}`;
                            document.getElementById('b-kod').innerText = `Kalıp No: ${data.modelB.kalipNo || '-'} | Kod: ${data.modelB.parcaKodu || '-'}`;
                            document.getElementById('b-hedef').innerText = getVal(data.modelB.hedef);
                        } else { document.getElementById('card-b').style.display = 'none'; }
                        
                        if(data.modelC) {
                            document.getElementById('card-c').style.display = 'block';
                            document.getElementById('c-isim').innerText = `${data.modelC.parcaAdi || '-'}`;
                            document.getElementById('c-kod').innerText = `Kalıp No: ${data.modelC.kalipNo || '-'} | Kod: ${data.modelC.parcaKodu || '-'}`;
                            document.getElementById('c-hedef').innerText = getVal(data.modelC.hedef);
                        } else { document.getElementById('card-c').style.display = 'none'; }

                        if(data.shifts && data.shifts.length > 0) {
                            let shiftHtml = "";
                            data.shifts.forEach((shift, index) => {
                                let isCurrent = (index === 0);
                                let title = isCurrent ? "Şu Anki Vardiya" : "Geçmiş Vardiya";
                                
                                shiftHtml += `
                                    <div class="shift-card ${isCurrent ? 'current' : ''}">
                                        <div>
                                            <div class="shift-title">${title} (${shift.label})</div>
                                            <div class="shift-date">${shift.date}</div>
                                            <div class="shift-stats">
                                                <span class="s-kalip">Toplam Kalıp: ${shift.toplamKalip}</span>
                                                <span class="s-fire">Toplam Fire: ${shift.toplamFire}</span>
                                            </div>
                                        </div>
                                        <div>
                                            <div class="shift-models-title">DETAYLI ÜRETİM</div>
                                            <!-- VBScript'ten gelen "<br>" taglari sayesinde modeller burada alt alta siralanir -->
                                            <div class="shift-models">${shift.modellerMetni}</div>
                                        </div>
                                    </div>
                                `;
                            });
                            document.getElementById('shift-container').innerHTML = shiftHtml;
                        }
                    }
                })
                .catch(err => {
                    console.log("Bağlantı hatası:", err);
                    document.getElementById('connection-status').className = "status offline";
                    document.getElementById('status-text').innerText = "İNTERNET KOPTU";
                });
        }

        updateDashboard();
        setInterval(updateDashboard, 5000); // Ekran kontrolünü hizli yapar ama yeni kalip basildiysa CANLI der.
    </script>
</body>
</html>
